<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionQC-Lite · 垫片表面缺陷视觉检测系统</title>
<style>
  :root {
    --bg:#0d1b2a; --panel:#15263a; --panel2:#1b3350; --line:#2b4a6b;
    --text:#e7f0fa; --muted:#8fa9c4; --cyan:#28d3c8; --green:#38e08a;
    --red:#ff5c6c; --amber:#ffb648;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  header{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#102239,#0d1b2a)}
  header h1{margin:0;font-size:20px;letter-spacing:.5px}
  header h1 span{color:var(--cyan)}
  .badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:20px}
  main{padding:22px 28px;max-width:1500px;margin:0 auto}
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .ctl label{font-size:12px;color:var(--muted)}
  select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none;cursor:pointer}
  select{min-width:130px}
  button.primary{background:var(--cyan);color:#062a2a;border-color:var(--cyan);font-weight:700}
  button:hover{filter:brightness(1.12)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h3{margin:0;font-size:13px;font-weight:600;padding:10px 14px;background:var(--panel2);color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .card h3 b{color:var(--cyan);font-size:12px}
  .card canvas{display:block;width:100%;image-rendering:pixelated;aspect-ratio:1/1;background:#000}
  .status{padding:10px 14px;font-size:12px;color:var(--muted);min-height:34px}
  .status .ok{color:var(--green)} .status .bad{color:var(--red)}
  .tablewrap{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:none}
  .hi{color:var(--cyan);font-weight:700}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  footer{padding:16px 28px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>Vision<span>QC</span>-Lite · 金属垫片表面缺陷视觉检测系统</h1>
  <div class="badge">v1.0.0 · 无深度学习 / 无训练样本 / 纯前端推理</div>
</header>
<main>
  <div class="controls">
    <div class="ctl"><label>缺陷类型</label><select id="kind">
      <option value="normal">正常样本</option><option value="scratch" selected>划痕 scratch</option>
      <option value="notch">缺口 notch</option><option value="stain">污渍 stain</option>
    </select></div>
    <div class="ctl"><label>光照工况</label><select id="light">
      <option value="0" selected>均匀光照</option><option value="1">线性渐变（单侧暗）</option><option value="2">局部强反光</option>
    </select></div>
    <div class="ctl"><label>随机种子</label><input id="seed" type="number" value="1001" style="width:110px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text)"></div>
    <button class="primary" id="run">生成并检测 ▶</button>
    <button id="next">换一张样本 ↻</button>
  </div>

  <div class="grid">
    <div class="card"><h3>① 原始图像 <b id="t1">128×128</b></h3><canvas id="c1" width="128" height="128"></canvas><div class="status" id="s1"></div></div>
    <div class="card"><h3>② 极坐标展开 <b>360×30</b></h3><canvas id="c2" width="360" height="120"></canvas><div class="status">环形 ROI → 矩形条带，角度为横轴、半径为纵轴</div></div>
    <div class="card"><h3>③ 背景抑制残差 <b>highlight</b></h3><canvas id="c3" width="360" height="120"></canvas><div class="status">差值 > 阈值的区域为候选缺陷</div></div>
    <div class="card"><h3>④ 检测结果 <b id="t4">—</b></h3><canvas id="c4" width="128" height="128"></canvas><div class="status" id="s4"></div></div>
  </div>

  <div class="tablewrap">
    <h3 style="margin:0 0 12px;font-size:14px">四种方案在同一样本上的表现</h3>
    <table>
      <thead><tr><th>方案</th><th>检出框数</th><th>真值框数</th><th>判定</th><th>说明</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="legend">
      <span><i class="dot" style="background:var(--green)"></i>绿色框 = 本文方法检出</span>
      <span><i class="dot" style="background:var(--red)"></i>红色框 = 真值标注</span>
      <span><i class="dot" style="background:var(--amber)"></i>橙色框 = 传统方案误检</span>
    </div>
  </div>
</main>
<footer>数据集为可控合成图像（含像素级真值），用于可复现对照实验；真实产线验证为项目已知边界。源码与评测脚本见仓库。</footer>

<!-- demo-core:start -->
<script>
/* VisionQC-Lite core algorithm — inlined for standalone offline demo */
/* VisionQC-Lite core algorithm — dependency-free (Node + browser UMD) */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.VisionCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const W = 128, H = 128, CX = 64, CY = 64, R0 = 22, R1 = 52;
  const PW = 360, PH = 30; // polar: angle columns x radius rows

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function illumination(x, y, mode) {
    if (mode === 1) return 45 * (x / W) - 22;                    // linear gradient
    if (mode === 2) return 42 * Math.exp(-(((x - 34) ** 2 + (y - 92) ** 2) / 650)); // specular
    return 0;                                                     // uniform
  }

  function generateImage(seed, cfg) {
    cfg = cfg || {};
    const rnd = mulberry32(seed);
    const mode = cfg.lightMode == null ? (seed % 3) : cfg.lightMode; // 0/1/2
    const kind = cfg.kind || 'normal'; // normal | scratch | notch | stain
    const g = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = x - CX + 0.5, dy = y - CY + 0.5;
        const d = Math.sqrt(dx * dx + dy * dy), ang = Math.atan2(dy, dx);
        let base;
        if (d < R0) base = 88 + 5 * Math.sin(ang * 3);
        else if (d > R1) base = 104 + 3 * Math.cos(x * 0.2);
        else base = 172 + 7 * Math.sin(ang * 9) + 4 * Math.cos(d * 0.9);
        const noise = (rnd() + rnd() + rnd() - 1.5) * 6;
        g[y * W + x] = clamp(Math.round(base + illumination(x, y, mode) + noise), 0, 255);
      }
    }
    const truth = [];
    const delta = new Float32Array(W * H); // most-negative applied once per pixel
    const track = { minX: 1e9, minY: 1e9, maxX: -1, maxY: -1, n: 0 };
    function mark(x, y, d) {
      x = Math.round(x); y = Math.round(y);
      if (x < 0 || y < 0 || x >= W || y >= H) return;
      const i = y * W + x;
      if (d < delta[i]) delta[i] = d;
      if (x < track.minX) track.minX = x; if (x > track.maxX) track.maxX = x;
      if (y < track.minY) track.minY = y; if (y > track.maxY) track.maxY = y;
      track.n++;
    }
    function finish(t) {
      if (track.n > 0) truth.push({ type: t, bbox: [track.minX, track.minY, track.maxX, track.maxY], n: track.n });
      track.minX = 1e9; track.minY = 1e9; track.maxX = -1; track.maxY = -1; track.n = 0;
    }

    if (kind === 'scratch' || kind === 'stain') {
      const a0 = rnd() * Math.PI * 2;
      const rc = 28 + rnd() * 16;
      if (kind === 'scratch') {
        const span = 0.22 + rnd() * 0.28;
        const width = 1.2 + rnd() * 1.0;
        const depth = 46 + rnd() * 28;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy);
          let ang = Math.atan2(dy, dx);
          let da = ang - a0; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
          if (Math.abs(da) <= span / 2 && Math.abs(r - rc) <= width) mark(x, y, -depth);
        }
      } else {
        const rad = 3.2 + rnd() * 2.6;
        const cx = CX + rc * Math.cos(a0), cy = CY + rc * Math.sin(a0);
        for (let y = Math.floor(cy - rad - 1); y <= Math.ceil(cy + rad + 1); y++) {
          for (let x = Math.floor(cx - rad - 1); x <= Math.ceil(cx + rad + 1); x++) {
            const d = Math.hypot(x - cx, y - cy);
            if (d <= rad) mark(x, y, -42 * (1 - d / (rad + 0.6)));
          }
        }
      }
      finish(kind);
    } else if (kind === 'notch') {
      const a0 = rnd() * Math.PI * 2, span = 0.10 + rnd() * 0.08;
      const depth = 3 + rnd() * 2;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy);
        let ang = Math.atan2(dy, dx);
        let da = ang - a0; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
        if (Math.abs(da) <= span / 2 && r >= R1 - depth && r <= R1) mark(x, y, -72);
      }
      finish('notch');
    }
    for (let i = 0; i < g.length; i++) if (delta[i] < 0) g[i] = clamp(Math.round(g[i] + delta[i]), 0, 255);
    return { w: W, h: H, gray: g, truth, meta: { seed, mode, kind } };
  }

  // row-major: index = r * PW + c  (r = radius row, c = angle column)
  function polarUnwrap(img) {
    const out = new Float32Array(PW * PH);
    const g = img.gray;
    for (let c = 0; c < PW; c++) {
      const a = (c / PW) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      for (let r = 0; r < PH; r++) {
        const rr = R0 + r * ((R1 - R0) / PH);
        const x = Math.round(CX + rr * ca), y = Math.round(CY + rr * sa);
        out[r * PW + c] = g[clamp(y, 0, H - 1) * W + clamp(x, 0, W - 1)];
      }
    }
    return out;
  }

  function boxBlur(src, w, h, kw, kh) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    const hw = kw >> 1, hh = kh >> 1;
    for (let y = 0; y < h; y++) {
      let sum = 0;
      for (let k = -hw; k <= hw; k++) sum += src[y * w + clamp(k, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        tmp[y * w + x] = sum / kw;
        sum += src[y * w + clamp(x + hw + 1, 0, w - 1)] - src[y * w + clamp(x - hw, 0, w - 1)];
      }
    }
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let k = -hh; k <= hh; k++) sum += tmp[clamp(k, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = sum / kh;
        sum += tmp[clamp(y + hh + 1, 0, h - 1) * w + x] - tmp[clamp(y - hh, 0, h - 1) * w + x];
      }
    }
    return out;
  }

  function boxBlurCircular(src, w, h, kw, kh) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    const hw = kw >> 1, hh = kh >> 1;
    for (let y = 0; y < h; y++) {
      let sum = 0;
      for (let k = -hw; k <= hw; k++) sum += src[y * w + ((k % w) + w) % w];
      for (let x = 0; x < w; x++) {
        tmp[y * w + x] = sum / kw;
        sum += src[y * w + ((x + hw + 1) % w)] - src[y * w + ((x - hw) % w + w) % w];
      }
    }
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let k = -hh; k <= hh; k++) sum += tmp[clamp(k, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = sum / kh;
        sum += tmp[clamp(y + hh + 1, 0, h - 1) * w + x] - tmp[clamp(y - hh, 0, h - 1) * w + x];
      }
    }
    return out;
  }

  function connectedComponents(mask, w, h) {
    const seen = new Uint8Array(w * h), comps = [], stack = [];
    for (let i = 0; i < mask.length; i++) {
      if (!mask[i] || seen[i]) continue;
      let minX = w, minY = h, maxX = 0, maxY = 0, area = 0;
      stack.length = 0; stack.push(i); seen[i] = 1;
      while (stack.length) {
        const p = stack.pop(), x = p % w, y = (p / w) | 0;
        area++; if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const q = ny * w + nx;
          if (mask[q] && !seen[q]) { seen[q] = 1; stack.push(q); }
        }
      }
      comps.push({ minX, minY, maxX, maxY, area });
    }
    return comps;
  }

  function polarBoxToCartesian(minC, minR, maxC, maxR) {
    let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    for (let c = minC; c <= maxC; c += Math.max(1, Math.floor((maxC - minC) / 6) || 1)) {
      for (let r = minR; r <= maxR; r++) {
        const a = (c / PW) * Math.PI * 2, rr = R0 + r * ((R1 - R0) / PH);
        const x = CX + rr * Math.cos(a), y = CY + rr * Math.sin(a);
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    return [Math.floor(minX - 1), Math.floor(minY - 1), Math.ceil(maxX + 1), Math.ceil(maxY + 1)];
  }

  function detectOurs(img) {
    const polar = polarUnwrap(img);
    const smooth = boxBlurCircular(polar, PW, PH, 3, 3);
    const bg = boxBlurCircular(smooth, PW, PH, 61, 15);
    const residual = Float32Array.from(smooth, (v, i) => bg[i] - v);
    const mask = new Uint8Array(PW * PH);
    // ignore outer 2 radial rows to avoid ring-boundary bias
    for (let r = 2; r < PH - 2; r++) for (let c = 0; c < PW; c++) {
      mask[r * PW + c] = residual[r * PW + c] > 12 ? 1 : 0;
    }
    const comps = connectedComponents(mask, PW, PH);
    const out = [];
    for (const c of comps) {
      const angleSpan = c.maxX - c.minX + 1, radialSpan = c.maxY - c.minY + 1;
      // angular elongation: real defects span multiple adjacent angle columns
      if (c.area < 5 || angleSpan < 4 || radialSpan < 1 || radialSpan > 14) continue;
      let peak = -1e9;
      for (let rr = c.minY; rr <= c.maxY; rr++) for (let cc = c.minX; cc <= c.maxX; cc++) {
        const v = residual[rr * PW + cc]; if (v > peak) peak = v;
      }
      if (peak < 20) continue;
      out.push({ bbox: polarBoxToCartesian(c.minX, c.minY, c.maxX, c.maxY), area: c.area, peak: +peak.toFixed(1) });
    }
    return { boxes: out, polar, residual };
  }

  // ablation: polar unwrap + background suppression, WITHOUT angular-consistency filter
  function detectOursNoFilter(img) {
    const polar = polarUnwrap(img);
    const smooth = boxBlurCircular(polar, PW, PH, 3, 3);
    const bg = boxBlurCircular(smooth, PW, PH, 61, 15);
    const residual = Float32Array.from(smooth, (v, i) => bg[i] - v);
    const mask = new Uint8Array(PW * PH);
    for (let r = 2; r < PH - 2; r++) for (let c = 0; c < PW; c++) mask[r * PW + c] = residual[r * PW + c] > 12 ? 1 : 0;
    const out = connectedComponents(mask, PW, PH).filter(c => c.area >= 3)
      .map(c => ({ bbox: polarBoxToCartesian(c.minX, c.minY, c.maxX, c.maxY), area: c.area }));
    return { boxes: out, residual };
  }

  function detectBaselineOtsu(img) {
    const g = img.gray, hist = new Float64Array(256);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = Math.hypot(x - CX, y - CY);
      if (d >= R0 && d <= R1) hist[g[y * W + x]]++;
    }
    let total = 0, sum = 0;
    for (let t = 0; t < 256; t++) { total += hist[t]; sum += t * hist[t]; }
    let wB = 0, sumB = 0, best = -1, thr = 0;
    for (let t = 0; t < 256; t++) {
      wB += hist[t]; if (!wB) continue;
      const wF = total - wB; if (!wF) break;
      sumB += t * hist[t];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const v = wB * wF * (mB - mF) * (mB - mF);
      if (v > best) { best = v; thr = t; }
    }
    const mask = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = Math.hypot(x - CX, y - CY);
      mask[y * W + x] = (d >= R0 && d <= R1 && g[y * W + x] < thr) ? 1 : 0;
    }
    return { boxes: connectedComponents(mask, W, H).filter(c => c.area >= 3).map(c => ({ bbox: [c.minX, c.minY, c.maxX, c.maxY], area: c.area })), threshold: thr };
  }

  function detectBaselineAdaptive(img) {
    const g = Float32Array.from(img.gray);
    const bg = boxBlur(g, W, H, 25, 25);
    const mask = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = Math.hypot(x - CX, y - CY);
      const i = y * W + x;
      mask[i] = (d >= R0 && d <= R1 && bg[i] - g[i] > 18) ? 1 : 0;
    }
    return { boxes: connectedComponents(mask, W, H).filter(c => c.area >= 3).map(c => ({ bbox: [c.minX, c.minY, c.maxX, c.maxY], area: c.area })) };
  }

  function match(predBoxes, truth) {
    const used = new Set(); let tp = 0;
    for (const t of truth) {
      const tx = (t.bbox[0] + t.bbox[2]) / 2, ty = (t.bbox[1] + t.bbox[3]) / 2;
      let best = -1, bd = 1e9;
      for (let i = 0; i < predBoxes.length; i++) {
        if (used.has(i)) continue;
        const b = predBoxes[i].bbox;
        const d = Math.hypot((b[0] + b[2]) / 2 - tx, (b[1] + b[3]) / 2 - ty);
        if (d < bd) { bd = d; best = i; }
      }
      if (best >= 0 && bd <= 7) { tp++; used.add(best); }
    }
    return { tp, fp: predBoxes.length - used.size, fn: truth.length - tp };
  }

  function makeDataset(count, seedBase) {
    const items = [], kinds = ['normal', 'scratch', 'notch', 'stain'];
    for (let i = 0; i < count; i++) {
      const kind = i % 4 === 0 ? 'normal' : kinds[i % 4];
      const mode = (i / 4 | 0) % 3;
      items.push(generateImage((seedBase || 1000) + i, { kind, lightMode: mode }));
    }
    return items;
  }

  function evaluate(items, detectors) {
    const res = {};
    for (const name of Object.keys(detectors)) {
      const agg = { tp: 0, fp: 0, fn: 0, byMode: [0, 1, 2].map(() => ({ tp: 0, fp: 0, fn: 0 })) };
      for (const img of items) {
        const det = detectors[name](img);
        const m = match(det.boxes, img.truth);
        agg.tp += m.tp; agg.fp += m.fp; agg.fn += m.fn;
        const bm = agg.byMode[img.meta.mode];
        bm.tp += m.tp; bm.fp += m.fp; bm.fn += m.fn;
      }
      const p = agg.tp / (agg.tp + agg.fp) || 0;
      const r = agg.tp / (agg.tp + agg.fn) || 0;
      res[name] = { tp: agg.tp, fp: agg.fp, fn: agg.fn, precision: +p.toFixed(4), recall: +r.toFixed(4), f1: +(2 * p * r / (p + r) || 0).toFixed(4), byMode: agg.byMode.map(b => ({ ...b, recall: +(b.tp / (b.tp + b.fn) || 0).toFixed(4), precision: +(b.tp / (b.tp + b.fp) || 0).toFixed(4) })) };
    }
    return res;
  }

  return { W, H, R0, R1, PW, PH, mulberry32, generateImage, polarUnwrap, boxBlur, boxBlurCircular, connectedComponents, detectOurs, detectOursNoFilter, detectBaselineOtsu, detectBaselineAdaptive, match, makeDataset, evaluate };
});

</script>
<!-- demo-core:end -->
<script>
(function(){
  if(!window.VisionCore){document.body.innerHTML='<p style="padding:40px">未能加载 vision-core.js，请确认目录结构完整。</p>';return;}
  const V=window.VisionCore;
  const $=id=>document.getElementById(id);
  let current=null;

  function drawGray(canvas,arr,w,h,scaleY){
    const ctx=canvas.getContext('2d'), img=ctx.createImageData(w,h);
    for(let i=0;i<w*h;i++){const v=Math.max(0,Math.min(255,arr[i]));img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=v;img.data[i*4+3]=255;}
    ctx.putImageData(img,0,0);
    if(scaleY&&scaleY!==1){const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').putImageData(img,0,0);ctx.clearRect(0,0,w,h);ctx.imageSmoothingEnabled=false;ctx.drawImage(tmp,0,0,w,h*scaleY);}
  }
  function drawPolar(canvas,arr){
    const ctx=canvas.getContext('2d'), img=ctx.createImageData(V.PW,V.PH);
    let mn=1e9,mx=-1e9;for(const v of arr){if(v<mn)mn=v;if(v>mx)mx=v;}
    for(let i=0;i<arr.length;i++){
      let v=(arr[i]-mn)/(mx-mn||1)*255;v=Math.max(0,Math.min(255,v));
      img.data[i*4]=v;img.data[i*4+1]=v;img.data[i*4+2]=v;img.data[i*4+3]=255;
    }
    const tmp=document.createElement('canvas');tmp.width=V.PW;tmp.height=V.PH;tmp.getContext('2d').putImageData(img,0,0);
    ctx.imageSmoothingEnabled=false;ctx.drawImage(tmp,0,0,V.PW,120);
  }
  function drawResidual(canvas,arr){
    const ctx=canvas.getContext('2d'), img=ctx.createImageData(V.PW,V.PH);
    for(let i=0;i<arr.length;i++){
      const v=Math.max(0,Math.min(255,arr[i]*3));
      img.data[i*4]=v;img.data[i*4+1]=v;img.data[i*4+2]=Math.min(255,v*0.5);img.data[i*4+3]=255;
    }
    const tmp=document.createElement('canvas');tmp.width=V.PW;tmp.height=V.PH;tmp.getContext('2d').putImageData(img,0,0);
    ctx.imageSmoothingEnabled=false;ctx.drawImage(tmp,0,0,V.PW,120);
  }
  function drawDetections(canvas,im,ours,truth){
    drawGray(canvas,im.gray,V.W,V.H);
    const ctx=canvas.getContext('2d');
    ctx.lineWidth=1;
    ctx.strokeStyle='#ff5c6c';
    for(const t of truth){const b=t.bbox;ctx.strokeRect(b[0],b[1],b[2]-b[0]+1,b[3]-b[1]+1);}
    ctx.strokeStyle='#38e08a';
    for(const d of ours.boxes){const b=d.bbox;ctx.strokeRect(b[0],b[1],b[2]-b[0]+1,b[3]-b[1]+1);}
  }
  function drawBaselineBoxes(canvas,im,boxes){
    drawGray(canvas,im.gray,V.W,V.H);
    const ctx=canvas.getContext('2d');ctx.lineWidth=1;ctx.strokeStyle='#ffb648';
    for(const d of boxes.slice(0,200)){const b=d.bbox;ctx.strokeRect(b[0],b[1],b[2]-b[0]+1,b[3]-b[1]+1);}
  }

  function run(){
    const seed=parseInt($('seed').value)||1001;
    const im=V.generateImage(seed,{kind:$('kind').value,lightMode:parseInt($('light').value)});
    current=im;
    const ours=V.detectOurs(im);
    const otsu=V.detectBaselineOtsu(im);
    const adaptive=V.detectBaselineAdaptive(im);
    const nofilter=V.detectOursNoFilter(im);

    drawGray($('c1'),im.gray,V.W,V.H);
    drawPolar($('c2'),ours.polar);
    drawResidual($('c3'),ours.residual);
    drawDetections($('c4'),im,ours,im.truth);

    $('s1').innerHTML='真值缺陷：<b>'+im.truth.length+'</b> 个 · 光照工况 '+im.meta.mode;
    const m=V.match(ours.boxes,im.truth);
    const hit=m.tp>0&&m.fn===0&&m.fp===0;
    $('s4').innerHTML='<span class="'+(hit?'ok':'bad')+'">检出 '+ours.boxes.length+' 框 · TP '+m.tp+' / FP '+m.fp+' / FN '+m.fn+'</span>';
    $('t4').textContent=ours.boxes.length+' boxes';

    const rows=[
      ['A 全局 Otsu 阈值',otsu.boxes.length,'传统方案：光照不均导致大面积误检'],
      ['B 笛卡尔局部背景抑制',adaptive.boxes.length,'能压光照，但环形边缘纹理造成大量误检'],
      ['C 极坐标展开（无一致性滤波）',nofilter.boxes.length,'召回提升，但纹理候选未被滤除'],
      ['D 本文完整方法',ours.boxes.length,'角度连续性 + 峰值约束，误检显著下降']
    ];
    $('rows').innerHTML=rows.map((r,i)=>'<tr><td'+(i===3?' class="hi"':'')+'>'+r[0]+'</td><td>'+r[1]+'</td><td>'+im.truth.length+'</td><td'+(i===3?' class="hi"':'')+'>'+(i===3?(hit?'✓ 正确':'⚠ 检查'):'—')+'</td><td>'+r[2]+'</td></tr>').join('');
  }
  $('run').addEventListener('click',run);
  $('next').addEventListener('click',function(){$('seed').value=parseInt($('seed').value||1001)+137;run();});
  run();
})();
</script>
</body>
</html>
